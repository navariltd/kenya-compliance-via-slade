[project]
name = "kenya_compliance_via_slade"
authors = [
    { name = "Navari", email = "support@navari.co.ke"}
]
description = "Kenya Compliance via Slade360"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "aiohttp>=3.14.5,<4",
    "deprecation>=2.1.0,<3",
    "qrcode>=7.4.2,<9",
    "bs4"
]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
csf_ke = ">=16.5.0,<17.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.isort]
profile = "black"
line_length = 88
known_frappe = "frappe"
known_erpnext = "erpnext"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FRAPPE", "ERPNEXT", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
combine_as_imports = true

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]  # Known conflicts with Black
exclude = ["node_modules", ".git", "__pycache__"]